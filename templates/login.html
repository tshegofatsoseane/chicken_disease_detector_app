<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kgosi BioDrone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .input-field {
      @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-block mb-4">
        <img src="{{ url_for('static', filename='applogo.png') }}" alt="Kgosi BioDrone Logo" class="h-16 w-16 rounded-lg shadow-lg">
      </div>
      <h1 class="text-3xl font-bold text-purple-700 mb-2">Kgosi BioDrone</h1>
      <p class="text-gray-600">AI-Powered Poultry Health Monitoring</p>
    </div>

    <!-- Login Form -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      {% if error %}
        <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
          <p class="text-red-700 text-sm">❌ {{ error }}</p>
        </div>
      {% endif %}

      <form method="POST" class="space-y-5">
        <!-- Username -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
          <input 
            type="text" 
            name="username" 
            required 
            class="input-field"
            placeholder="Enter your username"
            autofocus
          >
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
          <input 
            type="password" 
            name="password" 
            required 
            class="input-field"
            placeholder="Enter your password"
          >
        </div>

        <!-- Remember Me -->
        <div class="flex items-center space-x-2">
          <input 
            type="checkbox" 
            id="remember" 
            name="remember"
            class="rounded"
          >
          <label for="remember" class="text-sm text-gray-600">
            Remember me
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 mt-6"
        >
          Sign In
        </button>
      </form>

      <!-- Register Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Don't have an account? 
          <a href="{{ url_for('register') }}" class="text-purple-600 font-semibold hover:underline">
            Create one now
          </a>
        </p>
      </div>
    </div>

    <!-- Info Box -->
    <div class="mt-6 bg-purple-50 border border-purple-200 rounded-lg p-4">
      <p class="text-xs text-purple-800">
        <strong>🔒 Secure Login:</strong> Your credentials are encrypted and securely stored. Use your registered email for payments.
      </p>
    </div>
  </div>

</body>
</html>
