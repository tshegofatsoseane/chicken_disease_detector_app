<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Kgosi BioDrone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .input-field {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #9f7aea; /* Purple border */
      border-radius: 12px;
      background-color: #f5f3ff;
      font-size: 18px;
      color: #333;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-field:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.3);
    }

    .checkbox-field {
      width: 20px;
      height: 20px;
      accent-color: #7c3aed;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-block mb-4">
        <img src="{{ url_for('static', filename='applogo.png') }}" alt="Kgosi BioDrone Logo" class="h-16 w-16 rounded-lg shadow-lg">
      </div>
      <h1 class="text-3xl font-bold text-purple-700 mb-2">Kgosi BioDrone</h1>
      <p class="text-gray-600">Create your account to get started</p>
    </div>

    <!-- Registration Form -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      {% if error %}
        <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
          <p class="text-red-700 text-sm">❌ {{ error }}</p>
        </div>
      {% endif %}

      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
          <input type="text" name="username" required class="input-field" placeholder="Enter your username" minlength="3">
          <p class="text-xs text-gray-500 mt-1">At least 3 characters</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
          <input type="email" name="email" required class="input-field" placeholder="you@example.com">
          <p class="text-xs text-gray-500 mt-1">We'll use this for payments and notifications</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
          <input type="password" name="password" required class="input-field" placeholder="Enter a strong password" minlength="6">
          <p class="text-xs text-gray-500 mt-1">At least 6 characters</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
          <input type="password" name="confirm_password" required class="input-field" placeholder="Confirm your password" minlength="6">
        </div>

        <div class="flex items-start space-x-2 pt-2">
          <input type="checkbox" id="terms" required class="checkbox-field">
          <label for="terms" class="text-xs text-gray-600">
            I agree to the <span class="text-purple-700 font-semibold">Terms of Service</span> and <span class="text-purple-700 font-semibold">Privacy Policy</span>
          </label>
        </div>

        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-lg transition duration-200 mt-6 text-lg">
          Create Account
        </button>
      </form>

      <di
