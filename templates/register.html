<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Kgosi BioDrone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .input-field {
      @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-block mb-4">
        <img src="{{ url_for('static', filename='applogo.png') }}" alt="Kgosi BioDrone Logo" class="h-16 w-16 rounded-lg shadow-lg">
      </div>
      <h1 class="text-3xl font-bold text-purple-700 mb-2">Kgosi BioDrone</h1>
      <p class="text-gray-600">Create your account to get started</p>
    </div>

    <!-- Registration Form -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      {% if error %}
        <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
          <p class="text-red-700 text-sm">❌ {{ error }}</p>
        </div>
      {% endif %}

      <form method="POST" class="space-y-4">
        <!-- Username -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
          <input 
            type="text" 
            name="username" 
            required 
            class="input-field"
            placeholder="Enter your username"
            minlength="3"
          >
          <p class="text-xs text-gray-500 mt-1">At least 3 characters</p>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
          <input 
            type="email" 
            name="email" 
            required 
            class="input-field"
            placeholder="you@example.com"
          >
          <p class="text-xs text-gray-500 mt-1">We'll use this for payments and notifications</p>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
          <input 
            type="password" 
            name="password" 
            required 
            class="input-field"
            placeholder="Enter a strong password"
            minlength="6"
          >
          <p class="text-xs text-gray-500 mt-1">At least 6 characters</p>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
          <input 
            type="password" 
            name="confirm_password" 
            required 
            class="input-field"
            placeholder="Confirm your password"
            minlength="6"
          >
        </div>

        <!-- Terms -->
        <div class="flex items-start space-x-2 pt-2">
          <input 
            type="checkbox" 
            id="terms" 
            required 
            class="mt-1 rounded"
          >
          <label for="terms" class="text-xs text-gray-600">
            I agree to the <span class="text-purple-700 font-semibold">Terms of Service</span> and 
            <span class="text-purple-700 font-semibold">Privacy Policy</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 mt-6"
        >
          Create Account
        </button>
      </form>

      <!-- Login Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Already have an account? 
          <a href="{{ url_for('login') }}" class="text-purple-600 font-semibold hover:underline">
            Sign In
          </a>
        </p>
      </div>
    </div>

    <!-- Info Box -->
    <div class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
      <p class="text-xs text-blue-800">
        <strong>💡 Tip:</strong> Use your real email address for secure payments and report delivery.
      </p>
    </div>
  </div>

</body>
</html>
