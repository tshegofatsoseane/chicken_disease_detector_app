<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Kgosi BioDrone</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b px-6 py-3 flex items-center">
    <img src="{{ url_for('static', filename='applogo.png') }}" alt="Logo" class="h-10 w-10 rounded-lg shadow-sm mr-3">
    <h1 class="text-xl font-semibold text-purple-700">Kgosi BioDrone</h1>
  </header>

  <!-- Main -->
  <main class="flex-grow flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
      <h2 class="text-2xl font-semibold text-purple-700 mb-4 text-center">Create a new account</h2>
      {% if error %}
        <p class="text-red-500 mb-3 text-center">{{ error }}</p>
      {% endif %}
      <form action="/register" method="POST" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium">Username</label>
          <input type="text" name="username" class="w-full border rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-purple-500" required>
        </div>
        <div>
          <label class="block text-gray-700 font-medium">Password</label>
          <input type="password" name="password" class="w-full border rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-purple-500" required>
        </div>
        <button type="submit" class="w-full bg-purple-700 text-white py-2 rounded-lg hover:bg-purple-800 transition">Register</button>
      </form>
      <p class="mt-4 text-sm text-gray-500 text-center">Already have an account? <a href="/login" class="text-purple-700 font-semibold">Login</a></p>
    </div>
  </main>

</body>
</html>
